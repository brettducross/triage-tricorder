<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#060b14" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Tricorder MD" />
  <title>Home Triage Tricorder — AI Smartphone Physical Exam Suite</title>
  <meta name="description" content="Guided 60-Second Head-to-Toe Baseline Scan, Dynamic Symptom Triage, 5-Lab Smartphone Physical Exam Suite & 1-Page Doctor Handoff PDF." />
  <link rel="canonical" href="https://brettducross.github.io/triage-tricorder/app/index.html" />

  <!-- OpenGraph & Twitter Card Meta Tags -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Home Triage Tricorder" />
  <meta property="og:title" content="Home Triage Tricorder — AI Smartphone Physical Exam & Pre-Visit Triage Suite" />
  <meta property="og:description" content="Run a 60-second camera rPPG, raw mic stethoscope, 6-axis IMU tremor/Romberg, and 240Hz neuro checkup in your browser. Track up to 5 family baselines & export 1-page Doctor Handoff PDFs." />
  <meta property="og:url" content="https://brettducross.github.io/triage-tricorder/app/index.html" />
  <meta property="og:image" content="https://brettducross.github.io/triage-tricorder/ui-screens/interactive-3-updated-4phone-board.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Home Triage Tricorder — AI Smartphone Physical Exam Suite" />
  <meta name="twitter:description" content="60-second camera rPPG, raw mic auscultation, 6-axis IMU tremor/Romberg & 1-page Doctor Handoff PDF." />
  <meta name="twitter:image" content="https://brettducross.github.io/triage-tricorder/ui-screens/interactive-3-updated-4phone-board.png" />

  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="pupilFlashOverlay" class="pupil-flash-overlay"></div>

  <div class="app-shell">
    <!-- Top Header -->
    <header class="top-header">
      <div class="brand-row">
        <img src="./icons/icon.svg" alt="Tricorder Logo" class="brand-icon" />
        <div>
          <div class="brand-title">
            Home Triage Tricorder
            <span class="badge-mvp">PWA + Native Bridge v1</span>
          </div>
          <div class="brand-subtitle">Multi-Sensor Smartphone Physical Exam &amp; Dynamic Clinical Triage</div>
        </div>
      </div>

      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
        <button id="openCustomizerBtn" class="btn btn-secondary" type="button" style="padding:7px 12px;font-size:0.76rem;">
          🎨 Customize UI
        </button>
        <div class="sim-toggle-wrap" title="Toggle between Live Hardware Sensors and Physiological Demo Waveforms">
          <span class="sim-toggle-label" id="signalModeLabel">Live Hardware Sensors</span>
          <button id="simModeToggle" class="switch-btn" type="button" aria-label="Toggle Demo Signal">
            <span class="switch-ReadThumb"></span>
          </button>
        </div>
      </div>
    </header>

    <!-- Hardware Sensor Status Bar -->
    <div id="sensorStatusBar" class="sensor-status-bar"></div>

    <!-- Live UI Customizer Drawer (Theme / Layout / Buttons) -->
    <div id="uiCustomizerDrawer" class="ui-customizer-drawer"></div>

    <!-- Prominent One-Tap Live Phone Sensor Activator + Family Member Profile Bar -->
    <div id="liveSensorFamilyBar" class="live-family-bar"></div>

    <!-- Primary Navigation -->
    <nav id="primaryNavTabs" class="nav-tabs" role="tablist">
      <button class="nav-tab active" data-tab="home" type="button">
        <span>🏠 Home &amp; Baseline</span>
      </button>
      <button class="nav-tab" data-tab="checkup" type="button">
        <span>⚡ 60s Checkup Scan</span>
      </button>
      <button class="nav-tab" data-tab="triage" type="button">
        <span>🩺 Symptom Triage</span>
      </button>
      <button class="nav-tab" data-tab="toolbox" type="button">
        <span>🧰 Doctor's Black Bag</span>
      </button>
      <button class="nav-tab" data-tab="native" type="button">
        <span>📱 History &amp; Native Bridge</span>
      </button>
    </nav>

    <!-- Main Dynamic View Root -->
    <main id="appRoot"></main>
  </div>

  <script type="module" src="./src/app.js"></script>
</body>
</html>
